name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Code Quality (ruff: lint + format check) ──────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.10

      - name: Lint (ruff check)
        run: ruff check extanalyze/ --output-format=github

      - name: Format check (ruff format)
        run: ruff format --check extanalyze/

  # ── 2. SAST (bandit: static security analysis) ───────────────────────────
  sast:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]==1.8.3

      - name: Run bandit
        # -ll = only medium+ severity, -ii = only medium+ confidence
        # Fail on any finding at medium/high severity+confidence
        run: |
          bandit -r extanalyze/ \
            -ll -ii \
            --format sarif \
            --output bandit-results.sarif \
            --exit-zero  # we upload SARIF regardless, separate step fails PR

          bandit -r extanalyze/ -ll -ii --format txt

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # ── 3. SCA (pip-audit: dependency vulnerability scanning) ────────────────
  sca:
    name: SCA — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit dependencies
        # Checks all declared dependencies against OSV + PyPI advisories
        # --strict: non-zero exit on any vuln
        run: |
          pip-audit \
            --requirement <(pip install -e . --dry-run --quiet 2>/dev/null; \
                            pip freeze 2>/dev/null | grep -v "^-e") \
            --format markdown \
            --output pip-audit-results.md \
            --strict || true

          pip install -e ".[dev]" --quiet
          pip-audit --format markdown --strict

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.md
          if-no-files-found: ignore

  # ── 4. Tests (pytest with coverage) ──────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=extanalyze \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            -v

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── 5. Build check (ensure the package builds correctly) ─────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution (twine)
        run: twine check dist/*

      - name: Verify CLI entry point
        run: |
          pip install dist/*.whl
          extanalyze --version
          extanalyze --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
