name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Code Quality ────────────────────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.10

      - name: Lint
        run: ruff check extanalyze/ --output-format=github

      - name: Format check
        run: ruff format --check extanalyze/

  # ── 2. SAST ────────────────────────────────────────────────────────────────
  sast:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        # 1.8.x — sarif output not available until 1.9, use json instead
        run: pip install "bandit[toml]>=1.7,<1.9"

      - name: Run bandit
        # -ll = medium+ severity, -ii = medium+ confidence
        # --exit-zero: findings are surfaced as artifact, not CI failures
        # (promoted to failure once baseline is clean)
        run: |
          bandit -r extanalyze/ \
            -ll -ii \
            --format json \
            --output bandit-results.json \
            --exit-zero

          # Also print human-readable summary to the log
          bandit -r extanalyze/ -ll -ii --format txt || true

      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json
          if-no-files-found: ignore

  # ── 3. SCA ─────────────────────────────────────────────────────────────────
  sca:
    name: SCA — pip-audit + guarddog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SCA tools
        run: pip install "pip-audit>=2.7" "guarddog>=3.2.0"

      - name: pip-audit — known CVEs in runtime deps
        # requirements.txt: runtime deps only (no pip, no dev tools, not extanalyze itself)
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format markdown \
            --output pip-audit-results.md

      - name: guarddog — malicious package heuristics
        # Scans each runtime dep for supply-chain attack indicators:
        # obfuscation, network calls in setup.py, typosquatting, C2 patterns, etc.
        # --no-sandbox: kernel sandbox not available in standard GitHub runners
        run: |
          PKGS=$(grep -v '^#' requirements.txt | grep -v '^$' | sed 's/[>=<].*//')
          FAILED=0
          for pkg in $PKGS; do
            echo "=== guarddog: $pkg ==="
            guarddog pypi scan "$pkg" --no-sandbox --exit-non-zero-on-finding || FAILED=$((FAILED+1))
          done
          if [ $FAILED -gt 0 ]; then
            echo "::error::guarddog flagged $FAILED package(s) as potentially malicious"
            exit 1
          fi
          echo "All packages clean."

      - name: Upload SCA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: pip-audit-results.md
          if-no-files-found: ignore

  # ── 4. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=extanalyze \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=30 \
            -v
        # Coverage threshold: 30% reflects unit tests covering core analysis
        # modules. Network/IO modules (downloader, store_meta, worker, reporters)
        # require integration tests — tracked in backlog.

      - name: Upload coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── 5. Build check ─────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distribution
        run: |
          pip install build twine
          python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Verify CLI entry point
        run: |
          pip install dist/*.whl
          extanalyze --version
          extanalyze --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
