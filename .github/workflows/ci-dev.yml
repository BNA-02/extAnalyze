name: CI — Dev

# Runs on every push to develop and on PRs targeting develop.
# Optimized for fast feedback: single Python version, informational SAST.
# Passing this is required before opening a PR to main.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Code Quality ────────────────────────────────────────────────────────
  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.4.10
      - run: ruff check extanalyze/ --output-format=github
      - run: ruff format --check extanalyze/

  # ── 2. SAST ────────────────────────────────────────────────────────────────
  sast:
    name: SAST — Bandit (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "bandit[toml]>=1.7,<1.9"

      - name: Run bandit
        # --exit-zero on dev: findings surface as artifact, do not block the branch.
        # The same scan runs with --exit-non-zero on PRs to main.
        run: |
          bandit -r extanalyze/ -ll -ii \
            --format json --output bandit-results.json \
            --exit-zero
          bandit -r extanalyze/ -ll -ii --format txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-dev-${{ github.run_id }}
          path: bandit-results.json
          if-no-files-found: ignore

  # ── 3. SCA ─────────────────────────────────────────────────────────────────
  sca:
    name: SCA — pip-audit + guarddog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "pip-audit>=2.7" "guarddog>=3.2.0"

      - name: pip-audit
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format markdown \
            --output pip-audit-results.md

      - name: guarddog
        run: |
          PKGS=$(grep -v '^#' requirements.txt | grep -v '^$' | sed 's/[>=<].*//')
          FAILED=0
          for pkg in $PKGS; do
            echo "=== $pkg ==="
            guarddog pypi scan "$pkg" --no-sandbox --exit-non-zero-on-finding \
              || FAILED=$((FAILED+1))
          done
          [ $FAILED -gt 0 ] && echo "::error::guarddog flagged $FAILED package(s)" && exit 1
          echo "All packages clean."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-dev-${{ github.run_id }}
          path: pip-audit-results.md
          if-no-files-found: ignore

  # ── 4. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Tests — Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=extanalyze \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=30 \
            -v

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-dev-${{ github.run_id }}
          path: coverage.xml
