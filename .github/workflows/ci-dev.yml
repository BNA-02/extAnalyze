name: CI — Dev

# Fast feedback on every push/PR to develop.
# Single Python version, informational SAST (warnings don't block),
# no build check — iterate quickly, catch issues early.
# Pass all jobs here before opening a PR to main.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: all jobs get read-only by default.
# Jobs that need more declare it explicitly.
permissions:
  contents: read

jobs:

  # ── 1. Workflow security audit (zizmor) ────────────────────────────────────
  zizmor:
    name: Workflow Audit — zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # needed if you later upload SARIF
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install zizmor

      - name: Run zizmor
        # Audit all workflow files for CI security issues.
        # Offline mode (no token) — metadata audits only; good enough for private repos.
        run: |
          zizmor .github/workflows/ || true

  # ── 2. Code Quality ────────────────────────────────────────────────────────
  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.16.9
      - run: ruff check extanalyze/ --output-format=github
      - run: ruff format --check extanalyze/

  # ── 3. SAST ────────────────────────────────────────────────────────────────
  sast:
    name: SAST — Bandit (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "bandit[toml]>=1.7,<1.9"

      - name: Run bandit
        # --exit-zero: findings surface as artifact only, never block dev branch.
        # Same scan runs with hard exit on PRs to main.
        run: |
          bandit -r extanalyze/ -ll -ii \
            --format json --output bandit-results.json \
            --exit-zero
          bandit -r extanalyze/ -ll -ii --format txt || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: bandit-dev-${{ github.run_id }}
          path: bandit-results.json
          if-no-files-found: ignore

  # ── 4. SCA ─────────────────────────────────────────────────────────────────
  sca:
    name: SCA — pip-audit + guarddog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "pip-audit>=2.7" "guarddog>=3.2.0"

      - name: pip-audit — known CVEs
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format markdown \
            --output pip-audit-results.md

      - name: guarddog — malicious package heuristics
        run: |
          PKGS=$(grep -v '^#' requirements.txt | grep -v '^$' | sed 's/[>=<].*//')
          FAILED=0
          for pkg in $PKGS; do
            echo "=== $pkg ==="
            OUT=$(guarddog pypi scan "$pkg" --no-sandbox --output-format json 2>/dev/null)
            FINDINGS=$(echo "$OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('findings', [])))")
            if [ "$FINDINGS" -gt 0 ]; then
              echo "$OUT" | python3 -m json.tool
              FAILED=$((FAILED+1))
              echo "::error::guarddog: $pkg has $FINDINGS finding(s)"
            else
              echo "Clean (0 findings)"
            fi
          done
          [ $FAILED -gt 0 ] && exit 1
          echo "All packages clean."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: sca-dev-${{ github.run_id }}
          path: pip-audit-results.md
          if-no-files-found: ignore

  # ── 5. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Tests — Python 3.12
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=extanalyze \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=30 \
            -v

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-dev-${{ github.run_id }}
          path: coverage.xml
