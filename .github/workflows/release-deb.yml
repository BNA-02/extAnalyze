name: Release - .deb

# Builds the self-contained .deb. Tag pushes (v*) publish it to a GitHub Release;
# manual runs only produce a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Build
        run: packaging/build-deb.sh dist-deb

      - name: Checksums
        run: cd dist-deb && sha256sum ./*.deb > SHA256SUMS

      - name: Lint package (informational)
        run: |
          sudo apt-get install -y --no-install-recommends lintian
          lintian --no-tag-display-limit dist-deb/*.deb || true

      - name: Smoke test in clean containers
        run: |
          for image in debian:12 ubuntu:24.04; do
            docker run --rm -v "$PWD/dist-deb:/d:ro" "$image" sh -c '
              apt-get update -qq && apt-get install -y /d/extanalyze_*.deb >/dev/null &&
              extanalyze --version && extanalyze --help >/dev/null'
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist-deb/*.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: deb-${{ github.run_id }}
          path: dist-deb/
          if-no-files-found: error

  release:
    name: Publish to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: deb-${{ github.run_id }}
          path: dist-deb
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          gh release upload "$TAG" --repo "$REPO" --clobber dist-deb/*.deb dist-deb/SHA256SUMS
