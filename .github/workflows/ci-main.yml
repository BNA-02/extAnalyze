name: CI - Main

# Quality gate for PRs into main.
# Stricter than dev: full Python matrix, bandit hard-fails, build mandatory.
# Configure branch protection on main to require all jobs here to pass.

on:
  pull_request:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ── 1. Workflow security audit (zizmor) ────────────────────────────────────
  zizmor:
    name: Workflow Audit - zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install zizmor

      - name: Run zizmor
        # Hard exit on main - workflow security issues block the PR.
        run: zizmor .github/workflows/

  # ── 2. Code Quality ────────────────────────────────────────────────────────
  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.16.9
      - run: ruff check extanalyze/ plugins/ --output-format=github
      - run: ruff format --check extanalyze/ plugins/

  # ── 3. SAST ────────────────────────────────────────────────────────────────
  sast:
    name: SAST - Bandit (hard gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev --python "3.12"

      - name: Run bandit
        # Hard gate: medium+/medium+ findings fail the PR.
        # Resolve findings or add #nosec with justification before merging.
        run: |
          uv run --no-sync bandit -r extanalyze/ plugins/dynamic/ -ll -ii \
            --format json --output bandit-results.json
          uv run --no-sync bandit -r extanalyze/ plugins/dynamic/ -ll -ii --format txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: bandit-main-${{ github.run_id }}
          path: bandit-results.json
          if-no-files-found: ignore

  # ── 4. SCA ─────────────────────────────────────────────────────────────────
  sca:
    name: SCA - pip-audit + guarddog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev --python "3.12"

      - name: pip-audit - known CVEs
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o audit-requirements.txt
          uv run --no-sync pip-audit \
            --requirement audit-requirements.txt \
            --disable-pip \
            --format markdown \
            --output pip-audit-results.md

      - name: guarddog - malicious package heuristics
        run: |
          PKGS=$(uv export --frozen --no-emit-project --no-hashes --format requirements-txt | grep -E '^[A-Za-z0-9]' | sed 's/[ ;=<>].*//')
          FAILED=0
          for pkg in $PKGS; do
            echo "=== $pkg ==="
            OUT=$(uv run --no-sync guarddog pypi scan "$pkg" --no-sandbox --output-format json 2>/dev/null)
            FINDINGS=$(echo "$OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('findings', [])))")
            if [ "$FINDINGS" -gt 0 ]; then
              echo "$OUT" | python3 -m json.tool
              FAILED=$((FAILED+1))
              echo "::error::guarddog: $pkg has $FINDINGS finding(s)"
            else
              echo "Clean (0 findings)"
            fi
          done
          [ $FAILED -gt 0 ] && exit 1
          echo "All packages clean."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: sca-main-${{ github.run_id }}
          path: pip-audit-results.md
          if-no-files-found: ignore

  # ── 5. Tests - full matrix ─────────────────────────────────────────────────
  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        # Threshold pinned to measured baseline - raise as integration tests are added.
        run: |
          uv run --no-sync pytest tests/ \
            --tb=short \
            --cov=extanalyze \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=34 \
            -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: matrix.python-version == '3.12'
        with:
          name: coverage-main-${{ github.run_id }}
          path: coverage.xml

  # ── 6. Build - runs after all gates pass ───────────────────────────────────
  build:
    name: Build + CLI smoke test
    runs-on: ubuntu-latest
    needs: [zizmor, quality, sast, sca, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Build distribution
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m build

      - name: Check distribution metadata
        run: uv run --no-sync twine check dist/*

      - name: Install from wheel with pip + CLI smoke test
        run: |
          python -m venv /tmp/pip-venv
          /tmp/pip-venv/bin/pip install dist/*.whl
          /tmp/pip-venv/bin/extanalyze --version
          /tmp/pip-venv/bin/extanalyze --help

      - name: Install from wheel with uv + CLI smoke test
        run: |
          uv venv /tmp/uv-venv
          uv pip install --python /tmp/uv-venv/bin/python dist/*.whl
          /tmp/uv-venv/bin/extanalyze --version
          uv tool install dist/*.whl
          extanalyze --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{ github.run_id }}
          path: dist/
