name: CI — Main

# Runs only on PRs targeting main.
# This is the quality gate before code reaches the stable branch.
# Stricter than dev: full Python matrix, bandit hard-fails, higher coverage,
# build + CLI smoke test mandatory.
#
# Branch protection on main should require this workflow to pass.

on:
  pull_request:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Code Quality ────────────────────────────────────────────────────────
  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.4.10
      - run: ruff check extanalyze/ --output-format=github
      - run: ruff format --check extanalyze/

  # ── 2. SAST ────────────────────────────────────────────────────────────────
  sast:
    name: SAST — Bandit (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "bandit[toml]>=1.7,<1.9"

      - name: Run bandit
        # Hard gate on main: medium+ severity AND medium+ confidence findings fail the PR.
        # Any new finding must be resolved or explicitly nosec'd before merge.
        run: |
          bandit -r extanalyze/ -ll -ii \
            --format json --output bandit-results.json
          bandit -r extanalyze/ -ll -ii --format txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-main-${{ github.run_id }}
          path: bandit-results.json
          if-no-files-found: ignore

  # ── 3. SCA ─────────────────────────────────────────────────────────────────
  sca:
    name: SCA — pip-audit + guarddog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "pip-audit>=2.7" "guarddog>=3.2.0"

      - name: pip-audit
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format markdown \
            --output pip-audit-results.md

      - name: guarddog
        run: |
          PKGS=$(grep -v '^#' requirements.txt | grep -v '^$' | sed 's/[>=<].*//')
          FAILED=0
          for pkg in $PKGS; do
            echo "=== $pkg ==="
            guarddog pypi scan "$pkg" --no-sandbox --exit-non-zero-on-finding \
              || FAILED=$((FAILED+1))
          done
          [ $FAILED -gt 0 ] && echo "::error::guarddog flagged $FAILED package(s)" && exit 1
          echo "All packages clean."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-main-${{ github.run_id }}
          path: pip-audit-results.md
          if-no-files-found: ignore

  # ── 4. Tests — full matrix ─────────────────────────────────────────────────
  test:
    name: Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=extanalyze \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=34 \
            -v
        # Threshold on main is pinned to the current measured baseline (34%).
        # Raise this as integration tests are added — never lower it.

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-main-${{ github.run_id }}
          path: coverage.xml

  # ── 5. Build — mandatory on main ───────────────────────────────────────────
  build:
    name: Build + CLI smoke test
    runs-on: ubuntu-latest
    needs: [quality, sast, sca, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distribution
        run: |
          pip install build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Install from wheel + CLI smoke test
        run: |
          pip install dist/*.whl
          extanalyze --version
          extanalyze --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
