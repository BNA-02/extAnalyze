name: CI — Main

# Quality gate for PRs into main.
# Stricter than dev: full Python matrix, bandit hard-fails, build mandatory.
# Configure branch protection on main to require all jobs here to pass.

on:
  pull_request:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ── 1. Workflow security audit (zizmor) ────────────────────────────────────
  zizmor:
    name: Workflow Audit — zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install zizmor

      - name: Run zizmor
        # Hard exit on main — workflow security issues block the PR.
        run: |
          zizmor .github/workflows/ \
            --format sarif \
            --output zizmor-results.sarif
          zizmor .github/workflows/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: zizmor-main-${{ github.run_id }}
          path: zizmor-results.sarif
          if-no-files-found: ignore

  # ── 2. Code Quality ────────────────────────────────────────────────────────
  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.4.10
      - run: ruff check extanalyze/ --output-format=github
      - run: ruff format --check extanalyze/

  # ── 3. SAST ────────────────────────────────────────────────────────────────
  sast:
    name: SAST — Bandit (hard gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "bandit[toml]>=1.7,<1.9"

      - name: Run bandit
        # Hard gate: medium+/medium+ findings fail the PR.
        # Resolve findings or add #nosec with justification before merging.
        run: |
          bandit -r extanalyze/ -ll -ii \
            --format json --output bandit-results.json
          bandit -r extanalyze/ -ll -ii --format txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: bandit-main-${{ github.run_id }}
          path: bandit-results.json
          if-no-files-found: ignore

  # ── 4. SCA ─────────────────────────────────────────────────────────────────
  sca:
    name: SCA — pip-audit + guarddog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "pip-audit>=2.7" "guarddog>=3.2.0"

      - name: pip-audit — known CVEs
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format markdown \
            --output pip-audit-results.md

      - name: guarddog — malicious package heuristics
        run: |
          PKGS=$(grep -v '^#' requirements.txt | grep -v '^$' | sed 's/[>=<].*//')
          FAILED=0
          for pkg in $PKGS; do
            echo "=== $pkg ==="
            guarddog pypi scan "$pkg" --no-sandbox --exit-non-zero-on-finding \
              || FAILED=$((FAILED+1))
          done
          [ $FAILED -gt 0 ] && echo "::error::guarddog flagged $FAILED package(s)" && exit 1
          echo "All packages clean."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: sca-main-${{ github.run_id }}
          path: pip-audit-results.md
          if-no-files-found: ignore

  # ── 5. Tests — full matrix ─────────────────────────────────────────────────
  test:
    name: Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Run tests
        # Threshold pinned to measured baseline — raise as integration tests are added.
        run: |
          pytest tests/ \
            --tb=short \
            --cov=extanalyze \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=34 \
            -v

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-main-${{ github.run_id }}
          path: coverage.xml

  # ── 6. Build — runs after all gates pass ───────────────────────────────────
  build:
    name: Build + CLI smoke test
    runs-on: ubuntu-latest
    needs: [zizmor, quality, sast, sca, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distribution
        run: |
          pip install build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Install from wheel + CLI smoke test
        run: |
          pip install dist/*.whl
          extanalyze --version
          extanalyze --help

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
