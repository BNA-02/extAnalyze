[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extanalyze-dynamic"
version = "0.1.0"
description = "Docker-sandboxed dynamic analysis plugin for extanalyze"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "extanalyze contributors" }]
dependencies = ["extanalyze>=0.1.0", "click>=8.1"]

[project.entry-points."extanalyze.dynamic"]
docker = "extanalyze_dynamic.runner:run_dynamic"

[project.entry-points."extanalyze.cli"]
dynamic = "extanalyze_dynamic.cli:dynamic"

[tool.setuptools.packages.find]
where = ["."]
include = ["extanalyze_dynamic*"]

[tool.setuptools.package-data]
extanalyze_dynamic = ["sandbox/*"]
